<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
    body {
      margin: 0;
    }
  </style>
</head>

<body>
<div id="map"></div>

<script>
  
  const map = L.map('map').setView([-37.787, 175.279], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // 📍 Example store markers (will be replaced dynamically later)
  const stores = [
    [-37.787, 175.279],
    [-37.790, 175.285],
    [-37.795, 175.275],
  ];

  stores.forEach(s => {
    L.marker(s).addTo(map);
  });

  const route = L.polyline(stores, {
    color: 'blue',
    weight: 4
  }).addTo(map);

  map.fitBounds(route.getBounds());
</script>

</body>
</html>
